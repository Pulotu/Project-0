<form
  class="card"
  action="https://formspree.io/f/meajbanw"
  method="POST"
>
  <input type="hidden" name="_subject" value="New ClearMark Deal Scenario Submission" />

  <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />

  <label for="name">Your Name</label>
  <input id="name" name="Name" type="text" required autocomplete="name" />

  <label for="email">Email</label>
  <input id="email" name="Email" type="email" required autocomplete="email" />

  <label for="phone">Phone</label>
  <input id="phone" name="Phone" type="tel" autocomplete="tel" />

  <label for="sponsor">Borrower / Sponsor Name</label>
  <input id="sponsor" name="Borrower or Sponsor Name" type="text" />

  <label for="location">Property Address or City / State</label>
  <input id="location" name="Property Address or City State" type="text" />

  <label for="property-type">Property Type</label>
  <select id="property-type" name="Property Type">
    <option value="">Select one</option>
    <option>Single-family rental</option>
    <option>2-4 unit residential investment</option>
    <option>Multifamily</option>
    <option>Mixed-use</option>
    <option>Retail</option>
    <option>Office</option>
    <option>Industrial</option>
    <option>Hospitality</option>
    <option>Land</option>
    <option>Other commercial real estate</option>
  </select>

  <label for="loan-purpose">Loan Purpose</label>
  <select id="loan-purpose" name="Loan Purpose">
    <option value="">Select one</option>
    <option>Purchase</option>
    <option>Refinance</option>
    <option>Cash-out refinance</option>
    <option>DSCR rental loan</option>
    <option>Bridge loan</option>
    <option>Construction</option>
    <option>Rehab / renovation</option>
    <option>Fix and flip</option>
    <option>Commercial property loan</option>
    <option>SBA / owner-user financing</option>
    <option>Other</option>
  </select>

  <label for="loan-amount">Requested Loan Amount</label>
  <input id="loan-amount" name="Requested Loan Amount" type="text" placeholder="$" />

  <label for="value">Estimated Value or Purchase Price</label>
  <input id="value" name="Estimated Value or Purchase Price" type="text" placeholder="$" />

  <label for="timeline">Timeline to Close</label>
  <input
    id="timeline"
    name="Timeline to Close"
    type="text"
    placeholder="Example: 30 days, ASAP, refinance timing flexible"
  />

  <label for="summary">Brief Deal Summary</label>
  <textarea
    id="summary"
    name="Brief Deal Summary"
    rows="7"
    placeholder="Tell us the property type, loan request, use of funds, sponsor background, income/rent details, and any timing issues."
  ></textarea>

  <p class="muted">
    Please do not submit Social Security numbers, bank account numbers, tax returns, photo IDs, credit reports, or other sensitive personal documents through this form. ClearMark will request documents through a secure channel if needed.
  </p>

  <button type="submit" class="btn">Submit Deal Scenario Securely</button>
</form>
