<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Login | ClearMark Credit Advisors</title><link rel="stylesheet" href="styles.css" /></head>
  <body>
    <header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html">ClearMark Credit Advisors</a></div></header>
    <main class="section container form-wrap">
      <h1>Partner Access</h1>
      <p class="muted">Sign in to submit a deal. We’ll respond with rapid feasibility feedback when inputs are complete.</p>
      <form id="loginForm" class="deal-form">
        <label>Email<input required type="email" id="email" placeholder="name@company.com" /></label>
        <label>Password<input required type="password" id="password" minlength="8" /></label>
        <button type="submit" class="btn">Sign In</button>
        <p id="loginMsg" class="muted"></p>
      </form>
    </main>
    <script src="main.js"></script>
  </body>
</html>
